<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2b3a2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>苍岚战纪</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
<link rel="stylesheet" href="style.css?v=20261112e" />
</head>
<body>
  <!-- 登录 / 注册 -->
  <div id="auth" class="screen">
    <div class="auth-card">
      <div class="logo">⚔️🐉</div>
      <h1>苍岚战纪</h1>
      <p class="sub">三职业 · 打怪爆装备 · 强化 · 红名恶徒 · 挂机</p>
      <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>
      <form id="authForm" autocomplete="on">
        <input id="fEmail" type="email" placeholder="邮箱" autocomplete="email" required />
        <input id="fPass" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" required minlength="6" />
        <input id="fNick" type="text" placeholder="角色昵称（最多 12 字）" maxlength="12" class="hidden" />
        <div id="fCodeRow" class="code-row hidden">
          <input id="fCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" />
          <button type="button" id="sendCodeBtn" class="btn">发送验证码</button>
        </div>
        <button type="submit" id="authBtn" class="btn primary big">登录并开始</button>
      </form>
      <a href="#" id="forgotLink" class="forgot">忘记密码？</a>
      <div id="authMsg" class="msg"></div>
      <p class="hint">游戏进度会实时保存到云端，换手机登录同一个邮箱就能接着玩。</p>
    </div>
  </div>

  <!-- 游戏 -->
  <div id="game" class="screen hidden">
    <canvas id="cv"></canvas>

    <div id="hud">
      <div class="hud-left">
        <div class="lvbadge" id="hLv">1</div>
        <div class="bars">
          <div class="nameRow"><span id="hName">勇者</span><span id="hZone" class="zone">苍岚城</span></div>
          <div class="bar hp"><div id="hHp"></div><span id="hHpT"></span></div>
          <div class="bar mp"><div id="hMp"></div><span id="hMpT"></span></div>
          <div class="bar xp"><div id="hXp"></div><span id="hXpT"></span></div>
        </div>
      </div>
      <div class="hud-right">
        <div class="gold">💰 <span id="hGold">0</span></div>
        <div class="sync" id="hSync">☁️</div>
        <div class="buff hidden" id="hBuff"></div>
      </div>
    </div>

    <div id="menuBar">
      <button data-open="bag">🎒<span>背包</span><i class="key">B</i></button>
      <button data-open="hero">🧝<span>角色</span><i class="key">J</i></button>
      <button data-open="quests">📜<span>任务</span><i class="key">Y</i></button>
      <button data-open="map">🗺️<span>地图</span><i class="key">M</i></button>
      <button data-open="settings">⚙️<span>设置</span><i class="key">O</i></button>
    </div>

    <div id="skillBar"></div>
    <div id="controls">
      <button id="btnInteract" class="cbtn interact hidden">交互</button>
      <button id="btnAuto" class="cbtn mini">🤖<span>挂机</span><i class="key">Z</i></button>
      <button id="btnSpeed" class="cbtn mini">🥤<span id="spdCnt">0</span><i class="key">R</i></button>
      <button id="btnMana" class="cbtn mini">🔹<span id="manaCnt">0</span><i class="key">X</i></button>
      <button id="btnPotion" class="cbtn mini">🧪<span id="potCnt">0</span><i class="key">Q</i></button>
      <button id="btnAttack" class="cbtn attack">⚔️<i class="key">空格</i></button>
    </div>
    <div id="joyBase" class="hidden"><div id="joyKnob"></div></div>

    <div id="toasts"></div>

    <div id="panel" class="hidden">
      <div class="panel-card">
        <div class="panel-head">
          <h2 id="pTitle"></h2>
          <button id="pClose" class="xbtn">✕</button>
        </div>
        <div id="pBody"></div>
      </div>
    </div>
  </div>

  <script src="game.js?v=20261112e"></script>
</body>
</html>
